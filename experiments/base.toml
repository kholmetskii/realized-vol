# Shared EUR/USD settings. Select a model with --models and --candidate.
version = 1

[dataset]
instrument = "EUR/USD"

[run]
run_id = "eurusd"
forecast_start = 2025-01-01
forecast_end = 2026-09-30

[target]
name = "realized_variance"
sessions = 1
kind = "session"

[execution]
name = "walk-forward"
min_train_size = 252
training_window = "expanding"
retrain_every = 1

[evaluation]
metrics = ["QLIKE", "log-RV MSE"]

[plot]
metric = "QLIKE"
