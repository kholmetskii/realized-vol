[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rvol"
version = "0.1.0"
description = "Compare realized-volatility forecasting models across assets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
]
notebooks = [
    "jinja2>=3.1",  # pandas DataFrame.style
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rvol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: tests that need network access or large data"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "N"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
