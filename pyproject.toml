[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rvol"
version = "0.1.0"
description = "Realized volatility: estimation and forecast evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
]

[project.scripts]
rvol-evaluate-forecasts = "rvol.cli.evaluate_forecasts:main"
rvol-forecast-plots = "rvol.cli.forecast_plots:main"
rvol-robustness-report = "rvol.cli.robustness_report:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rvol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: tests that need network access or large data"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
